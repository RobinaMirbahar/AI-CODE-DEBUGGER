name: Deploy to Streamlit
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & verify Streamlit entrypoint
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
          for f in *.py; do
            if [ -f "$f" ]; then python -m py_compile "$f"; fi
          done
          echo "Streamlit application validated and ready for Streamlit Community Cloud sync."